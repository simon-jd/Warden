# Signed by this repository's build workflow, SLSA provenance from the
# generator, CycloneDX SBOM, complete scan without KEV: admitted.
# verify-images.yaml, block-kev.yaml and resources.yaml are generated by
# supplychain/kyvernolab (TestKyvernoAdmission) via scripts/supplychain.py render.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: warden-signed-clean
policies:
  - verify-images.yaml
  - block-kev.yaml
resources:
  - resources.yaml
results:
  - policy: warden-verify-images
    rule: signed-image
    resources: [signed-clean]
    kind: Pod
    result: pass
  - policy: warden-verify-images
    rule: slsa-provenance
    resources: [signed-clean]
    kind: Pod
    result: pass
  - policy: warden-verify-images
    rule: cyclonedx-sbom
    resources: [signed-clean]
    kind: Pod
    result: pass
  - policy: warden-block-kev
    rule: complete-scan-no-kev
    resources: [signed-clean]
    kind: Pod
    result: pass
