# Same as signed-clean, but the signed complete scan lists a CISA KEV CVE:
# signature, provenance and SBOM pass, the KEV rule rejects.
# verify-images.yaml, block-kev.yaml and resources.yaml are generated by
# supplychain/kyvernolab (TestKyvernoAdmission) via scripts/supplychain.py render.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: warden-signed-kev
policies:
  - verify-images.yaml
  - block-kev.yaml
resources:
  - resources.yaml
results:
  - policy: warden-verify-images
    rule: signed-image
    resources: [signed-kev]
    kind: Pod
    result: pass
  - policy: warden-verify-images
    rule: slsa-provenance
    resources: [signed-kev]
    kind: Pod
    result: pass
  - policy: warden-verify-images
    rule: cyclonedx-sbom
    resources: [signed-kev]
    kind: Pod
    result: pass
  - policy: warden-block-kev
    rule: complete-scan-no-kev
    resources: [signed-kev]
    kind: Pod
    result: fail
