# No signature and no attestation: every rule rejects.
# verify-images.yaml, block-kev.yaml and resources.yaml are generated by
# supplychain/kyvernolab (TestKyvernoAdmission) via scripts/supplychain.py render.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: warden-unsigned
policies:
  - verify-images.yaml
  - block-kev.yaml
resources:
  - resources.yaml
results:
  - policy: warden-verify-images
    rule: signed-image
    resources: [unsigned]
    kind: Pod
    result: fail
  - policy: warden-verify-images
    rule: slsa-provenance
    resources: [unsigned]
    kind: Pod
    result: fail
  - policy: warden-verify-images
    rule: cyclonedx-sbom
    resources: [unsigned]
    kind: Pod
    result: fail
  - policy: warden-block-kev
    rule: complete-scan-no-kev
    resources: [unsigned]
    kind: Pod
    result: fail
