# Signature, SBOM and clean scan from another repository's build workflow
# (same CA, same issuer) and SLSA provenance for that repository: every rule
# rejects, so only the bound workflow identity is trusted.
# verify-images.yaml, block-kev.yaml and resources.yaml are generated by
# supplychain/kyvernolab (TestKyvernoAdmission) via scripts/supplychain.py render.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: warden-wrong-identity
policies:
  - verify-images.yaml
  - block-kev.yaml
resources:
  - resources.yaml
results:
  - policy: warden-verify-images
    rule: signed-image
    resources: [wrong-identity]
    kind: Pod
    result: fail
  - policy: warden-verify-images
    rule: slsa-provenance
    resources: [wrong-identity]
    kind: Pod
    result: fail
  - policy: warden-verify-images
    rule: cyclonedx-sbom
    resources: [wrong-identity]
    kind: Pod
    result: fail
  - policy: warden-block-kev
    rule: complete-scan-no-kev
    resources: [wrong-identity]
    kind: Pod
    result: fail
