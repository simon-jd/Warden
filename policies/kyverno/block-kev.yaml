{
  "apiVersion": "kyverno.io/v1",
  "kind": "ClusterPolicy",
  "metadata": {"name": "warden-block-kev-unbound"},
  "spec": {
    "background": false,
    "validationFailureAction": "Enforce",
    "webhookConfiguration": {"failurePolicy": "Fail", "timeoutSeconds": 30},
    "rules": [{
      "name": "deny-unbound-scan-trust",
      "match": {"any": [{"resources": {"kinds": ["Pod"]}}]},
      "validate": {
        "message": "Warden scan identity and CISA KEV evidence are unbound",
        "deny": {"conditions": {"all": [{"key": true, "operator": "Equals", "value": true}]}}
      }
    }]
  }
}
