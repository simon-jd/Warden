# kube-dns for the k3s Cilium lab (scripts/k3s_gvisor_lab.sh up --cilium).
# k3s's own CoreDNS stays disabled (runtimes/gvisor/lab/node/config.yaml);
# this one carries the labels the Cilium policies select (kube-system,
# k8s-app=kube-dns) and serves fixed names for the lab's "world" network
# (@WORLD@ is the /24 prefix the lab picked; runtimes/gvisor/lab/cilium/world.py):
#   .20 allowed.warden.test, img.cdn.warden.test   origin the allowlist lets through
#   .21 blocked.warden.test                         origin it must not
#   .22 stream.warden.test                          long-lived stream server (Task 14)
#   169.254.169.254 metadata.google.internal        metadata stand-in (warden-k3s-imds)
#   exfil.warden.test                               forwarded to .40, a resolver that
#                                                   logs every query (the exfil sink)
# Anything else is NXDOMAIN: the lab has no upstream resolver. Every query
# CoreDNS sees is logged. One server block per zone: CoreDNS runs its plugins
# in a fixed order (template before hosts and kubernetes), so a catch-all
# template in the same block as hosts would answer every name NXDOMAIN.
apiVersion: v1
kind: ServiceAccount
metadata: {name: coredns, namespace: kube-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: warden-lab-coredns}
rules:
  - apiGroups: [""]
    resources: [services, namespaces]
    verbs: [list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: warden-lab-coredns}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: warden-lab-coredns}
subjects: [{kind: ServiceAccount, name: coredns, namespace: kube-system}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: coredns, namespace: kube-system}
data:
  Corefile: |
    cluster.local in-addr.arpa {
        log
        errors
        health :8080
        ready :8181
        kubernetes cluster.local in-addr.arpa
        cache 5
    }
    warden.test {
        log
        errors
        hosts {
            @WORLD@.20 allowed.warden.test img.cdn.warden.test
            @WORLD@.21 blocked.warden.test
            @WORLD@.22 stream.warden.test
        }
    }
    exfil.warden.test {
        log
        errors
        forward . @WORLD@.40
    }
    google.internal {
        log
        errors
        hosts {
            169.254.169.254 metadata.google.internal
        }
    }
    . {
        log
        errors
        template ANY ANY {
            rcode NXDOMAIN
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: coredns, namespace: kube-system, labels: {k8s-app: kube-dns}}
spec:
  replicas: 1
  selector: {matchLabels: {k8s-app: kube-dns}}
  template:
    metadata: {labels: {k8s-app: kube-dns}}
    spec:
      serviceAccountName: coredns
      dnsPolicy: Default
      containers:
        - name: coredns
          image: docker.io/coredns/coredns:1.14.7
          imagePullPolicy: Never
          args: [-conf, /etc/coredns/Corefile]
          ports:
            - {name: dns, containerPort: 53, protocol: UDP}
            - {name: dns-tcp, containerPort: 53, protocol: TCP}
          resources:
            limits: {cpu: 200m, memory: 64Mi}
          securityContext:
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL], add: [NET_BIND_SERVICE]}
          readinessProbe:
            httpGet: {path: /ready, port: 8181}
            periodSeconds: 2
          volumeMounts:
            - {name: config, mountPath: /etc/coredns, readOnly: true}
      volumes:
        - name: config
          configMap: {name: coredns}
---
apiVersion: v1
kind: Service
metadata: {name: kube-dns, namespace: kube-system, labels: {k8s-app: kube-dns}}
spec:
  clusterIP: 10.43.0.10
  selector: {k8s-app: kube-dns}
  ports:
    - {name: dns, port: 53, protocol: UDP}
    - {name: dns-tcp, port: 53, protocol: TCP}
