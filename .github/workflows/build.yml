name: Warden control-plane supply chain

on:
  push:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    environment: supplychain-publish
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
      digest: ${{ steps.publish.outputs.digest }}
    env:
      TRUSTED_REPOSITORY: ${{ vars.WARDEN_TRUSTED_REPOSITORY }}
      TRUSTED_REF: ${{ vars.WARDEN_TRUSTED_REF }}
      IMAGE_REPOSITORY: ${{ vars.WARDEN_IMAGE_REPOSITORY }}
      WARDEN_NAMESPACE: ${{ vars.WARDEN_NAMESPACE }}
      ALLOW_PUBLIC_REKOR: ${{ vars.WARDEN_ALLOW_PUBLIC_REKOR }}
    steps:
      - name: Reject unbound or unprotected context
        env:
          ACTUAL_REPOSITORY: ${{ github.repository }}
          ACTUAL_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test -n "$TRUSTED_REPOSITORY" && test -n "$TRUSTED_REF"
          test -n "$IMAGE_REPOSITORY" && test -n "$WARDEN_NAMESPACE"
          test "$ALLOW_PUBLIC_REKOR" = true
          test "$ACTUAL_REPOSITORY" = "$TRUSTED_REPOSITORY"
          test "$ACTUAL_REF" = "$TRUSTED_REF"
          [[ "$TRUSTED_REPOSITORY" =~ ^[a-z0-9_.-]+/[a-z0-9_.-]+$ ]]
          [[ "$TRUSTED_REF" =~ ^refs/(heads|tags)/[A-Za-z0-9._/-]+$ ]]
          [[ "$TRUSTED_REF" != *".."* ]]
          [[ "$IMAGE_REPOSITORY" =~ ^ghcr[.]io(/[a-z0-9][a-z0-9._-]*)+$ ]]
          [[ "$WARDEN_NAMESPACE" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ ]]
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install fixed scanner, SBOM and signer releases
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/warden-tools"
          cd "$RUNNER_TEMP/warden-tools"
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' \
            -o syft.tar.gz https://github.com/anchore/syft/releases/download/v1.55.0/syft_1.55.0_linux_amd64.tar.gz
          echo 'bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d  syft.tar.gz' | sha256sum -c -
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' \
            -o grype.tar.gz https://github.com/anchore/grype/releases/download/v0.121.0/grype_0.121.0_linux_amd64.tar.gz
          echo '64e07133d3486115de647a66581461dccf5c732748a0a3119077395565f15519  grype.tar.gz' | sha256sum -c -
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' \
            -o cosign https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64
          echo '424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa  cosign' | sha256sum -c -
          tar -xzf syft.tar.gz syft
          tar -xzf grype.tar.gz grype
          chmod 0755 syft grype cosign
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Build and publish immutable control-plane image
        id: publish
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$REGISTRY_PASSWORD" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          tag="$IMAGE_REPOSITORY:$GITHUB_SHA"
          docker build --pull -f controlplane/Dockerfile -t "$tag" .
          docker push "$tag"
          ref="$(docker image inspect --format '{{index .RepoDigests 0}}' "$tag")"
          [[ "$ref" == "$IMAGE_REPOSITORY@sha256:"* ]]
          digest="${ref##*@}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=$IMAGE_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "IMAGE_REF=$IMAGE_REPOSITORY@$digest" >> "$GITHUB_ENV"
      - name: Render policies from actual trusted context
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          builder = ("https://github.com/slsa-framework/slsa-github-generator/"
                     ".github/workflows/generator_container_slsa3.yml@refs/tags/v2.1.0")
          binding = {
              "repository": os.environ["GITHUB_REPOSITORY"].lower(),
              "ref": os.environ["GITHUB_REF"],
              "image_repository": os.environ["IMAGE_REPOSITORY"],
              "image_digest": os.environ["IMAGE_REF"].split("@", 1)[1],
              "namespace": os.environ["WARDEN_NAMESPACE"],
              "slsa_subject": builder, "slsa_builder_id": builder,
          }
          with open("binding.json", "w", encoding="utf-8") as out:
              json.dump(binding, out)
          PY
          python3 scripts/supplychain.py render --binding binding.json --output-dir rendered-policies
      - name: Generate CycloneDX SBOM for that digest
        run: |
          set -euo pipefail
          syft "registry:$IMAGE_REF" -o cyclonedx-json > sbom.cdx.json
          python3 - <<'PY'
          import json
          with open("sbom.cdx.json", encoding="utf-8") as file:
              assert json.load(file)["bomFormat"] == "CycloneDX"
          PY
      - name: Scan complete image and fetch official CISA KEV catalog
        env:
          GRYPE_CHECK_FOR_APP_UPDATE: 'false'
          GRYPE_DB_UPDATE_URL: https://grype.anchore.io/databases
          GRYPE_INCLUDE_MATCHER_SUPPRESSIONS: 'true'
        run: |
          set -euo pipefail
          grype db update
          grype "registry:$IMAGE_REF" --match-upstream-kernel-headers -o json > grype.json
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' \
            -o cisa-kev.json https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
      - name: Assess unfiltered findings and preserve complete scan
        id: gate
        run: |
          set -euo pipefail
          set +e
          python3 scripts/supplychain.py assess --report grype.json --kev-catalog cisa-kev.json \
            --image-repository "$IMAGE_REPOSITORY" --image-digest "${IMAGE_REF##*@}" \
            --predicate scan-predicate.json --decision scan-decision.json
          code=$?
          set -e
          if [[ "$code" -gt 1 ]]; then exit "$code"; fi
          echo "gate=$code" >> "$GITHUB_OUTPUT"
      - name: Sign same-digest SBOM and complete scan attestations
        env:
          COSIGN_YES: 'true'
        run: |
          set -euo pipefail
          # Legacy .att tags, the format the SLSA generator writes and the
          # rendered policies verify (no Kyverno "type: SigstoreBundle").
          cosign attest --yes --new-bundle-format=false --use-signing-config=false \
            --type https://cyclonedx.org/bom --predicate sbom.cdx.json "$IMAGE_REF"
          cosign attest --yes --new-bundle-format=false --use-signing-config=false \
            --type https://warden.dev/attestations/grype-complete/v1 \
            --predicate scan-predicate.json "$IMAGE_REF"
      - name: Enforce fixable critical and KEV gate before signing image
        env:
          GATE_RESULT: ${{ steps.gate.outputs.gate }}
        run: |
          set -euo pipefail
          test "$GATE_RESULT" = 0
      - name: Keyless sign exact digest
        env:
          COSIGN_YES: 'true'
        run: |
          set -euo pipefail
          cosign sign --yes --new-bundle-format=false --use-signing-config=false "$IMAGE_REF"

  provenance:
    needs: [build]
    permissions:
      actions: read
      id-token: write
      packages: write
    # The generator requires a complete vX.Y.Z tag; a commit SHA is rejected.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.build.outputs.image }}
      digest: ${{ needs.build.outputs.digest }}
      registry-username: ${{ github.actor }}
      private-repository: ${{ github.event.repository.private }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
