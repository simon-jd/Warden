name: Sigma conversion, contracts and OpenSearch hit/miss

on:
  pull_request:
    paths:
      - detect/sigma/**
      - detect/report/coverage.py
      - detect/report/test_coverage.py
      - .github/workflows/detect.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-component:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PIP_CONFIG_FILE: /dev/null
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.4"
      - name: Install locked local-component dependencies
        run: >-
          timeout --kill-after=5s 180s python -B -m pip --isolated install
          --index-url https://pypi.org/simple --require-hashes --no-deps
          --no-compile --only-binary=:all: --no-cache-dir --retries 0 --timeout 8
          --disable-pip-version-check -r detect/sigma/requirements.lock
      - name: Check fixture contracts, real conversion and tag reporting
        run: |
          ulimit -c 0
          ulimit -v 1048576
          ulimit -t 45
          timeout --signal=TERM --kill-after=5s 50s python -B -m unittest \
            detect.sigma.test_contract detect.report.test_coverage
  opensearch-hit-miss:
    # Same check as `make test-opensearch`: a throwaway OpenSearch 2.19.1
    # container, every pos/neg/case fixture indexed, each rule's pySigma query
    # must hit exactly the expected documents.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PIP_CONFIG_FILE: /dev/null
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.4"
      - name: Install locked dependencies
        run: >-
          python -B -m pip --isolated install --index-url https://pypi.org/simple
          --require-hashes --no-deps --only-binary=:all: --no-cache-dir
          -r detect/sigma/requirements.lock
      - name: Sigma rules against real OpenSearch
        run: |
          docker pull opensearchproject/opensearch:2.19.1
          WARDEN_LIVE_OPENSEARCH=1 OS_OUT=opensearch-results.json \
            timeout 600s python -B -m unittest -v detect.sigma.test_rules
          cat opensearch-results.json
