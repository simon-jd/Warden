# Vector 0.45.0 internal_metrics namespace=vector -> Prometheus vector_ prefix.
groups:
  - name: warden-vector-buffers
    rules:
      - alert: WardenVectorBufferDiscarded
        expr: sum by (component_id) (increase(vector_buffer_discarded_events_total{component_id=~"^(agent_forward|os_api|os_process|os_network|reject)$"}[1m])) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Warden Vector discarded buffered events"
      # Vector 0.45.0 with a disk buffer and when_full=drop_newest loses events
      # in front of the buffer without incrementing buffer_discarded_events_total
      # (docs/evidence/task-11/backpressure-vector-drop-*), so the rule above
      # cannot see it. This one compares what the agent's label_* transforms
      # sent with what the agent_forward buffer accepted. Without loss the two
      # differ only by events in flight during a 10x burst: peaks of 403 and 833
      # with one input (block-run2, where a first version with "[1m] > 100"
      # fired falsely, and block-run3), and 215, 859 and 1109 with the same
      # traffic split over the six inputs (vector6-block-20261028-run1..3).
      # With loss the value reached 7642 and fired 11 s after the buffer filled
      # (vector6-drop-20261028-run1). 2000 keeps 1.8x headroom over the largest
      # no-loss peak; production rates per input are higher, so recalibrate on
      # real traffic.
      - alert: WardenVectorAgentForwardGap
        expr: (sum(increase(vector_component_sent_events_total{component_id=~"^label_(aks|azure|k3s|tetragon|vnet|warden)$"}[5m])) - sum(increase(vector_buffer_received_events_total{component_id="agent_forward"}[5m]))) > 2000
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Warden Vector agent lost events in front of the agent_forward buffer"
      - alert: WardenVectorNormalizationError
        expr: sum by (component_id) (increase(vector_component_errors_total{component_id=~"^norm_(azure|aks|k3s|vnet|tetragon|warden)$"}[1m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Warden normalization requires investigation; inspect redacted rejects"
