  "description": "Full binary-path indicator only. No args, connection, Pod/sandbox identity, transfer, mining or escape success exists in current Tetragon mapping. Synthetic fixtures; ATT&CK tags describe related investigation scenarios, not observed technique success.",
  "references": [],
  "author": "Warden",
  "date": "2026-10-25",
  "logsource": {
    "product": "linux",
    "category": "process_creation"
  },
  "detection": {
    "source": {
      "class_uid": 1007,
      "metadata.product.name": "tetragon"
    },
    "action": {
      "process.name|endswith": [
        "/socat"
      ]
    },
    "condition": "source and action"
