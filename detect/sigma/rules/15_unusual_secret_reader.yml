{
  "title": "Secret read by nonallowlisted service account",
  "id": "21c89bd1-10e0-53da-9f47-0d173fa49bb6",
  "status": "experimental",
  "description": "Conditional objectRef passthrough only (all unmapped <=2048B). No current collector, authorization, privilege delta, command or token theft proof. Synthetic fixtures; ATT&CK tags describe related investigation scenarios, not observed technique success.",
  "references": [
    "https://attack.mitre.org/techniques/T1552/007/"
  ],
  "author": "Warden",
  "date": "2026-10-25",
  "logsource": {
    "product": "kubernetes",
    "service": "audit"
  },
  "detection": {
    "source": {
      "class_uid": 6003,
      "metadata.product.name": "kubernetes audit"
    },
    "action": {
      "api.operation": [
        "get",
        "list"
      ],
      "unmapped.objectRef.resource": "secrets",
      "actor.user.uid|startswith": "system:serviceaccount:"
    },
    "required": {
      "actor.user.uid|exists": true
    },
    "allowed": {
      "actor.user.uid": [
        "system:serviceaccount:warden-lab:secret-reader"
      ]
    },
    "condition": "source and action and required and not allowed"
  },
  "falsepositives": [
    "Authorized administration, developer/debug tooling, permitted workloads or unrelated protocol use; tune local IP/principal allowlists."
  ],
  "level": "medium",
  "tags": [
    "attack.credential_access",
    "attack.t1552.007"
  ]
}
