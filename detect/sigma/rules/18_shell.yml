{
  "title": "Unix shell execution indicator",
  "id": "df4d7f13-64ec-5102-967d-4b25096eb332",
  "status": "experimental",
  "description": "Full binary-path indicator only. No args, connection, Pod/sandbox identity, transfer, mining or escape success exists in current Tetragon mapping. Synthetic fixtures; ATT&CK tags describe related investigation scenarios, not observed technique success.",
  "references": [
    "https://attack.mitre.org/techniques/T1059/004/"
  ],
  "author": "Warden",
  "date": "2026-10-25",
  "logsource": {
    "product": "linux",
    "category": "process_creation"
  },
  "detection": {
    "source": {
      "class_uid": 1007,
      "metadata.product.name": "tetragon"
    },
    "action": {
      "process.name|endswith": [
        "/sh",
        "/bash",
        "/dash"
      ]
    },
    "condition": "source and action"
  },
  "falsepositives": [
    "Authorized administration, developer/debug tooling, permitted workloads or unrelated protocol use; tune local IP/principal allowlists."
  ],
  "level": "medium",
  "tags": [
    "attack.execution",
    "attack.t1059.004"
  ]
}
