[[tests]]
name = "production_source_label_azure"
no_outputs_from = ["source_route.aks", "source_route.k3s", "source_route.vnet", "source_route.tetragon", "source_route.warden"]
[[tests.inputs]]
insert_at = "source_route"
type = "vrl"
source = '''. = {"warden_source":"azure","message":"route-only fixture","marker":"route-azure"}'''
[[tests.outputs]]
extract_from = "source_route.azure"
[[tests.outputs.conditions]]
type = "vrl"
source = '''assert_eq!(., {"warden_source":"azure","message":"route-only fixture","marker":"route-azure"})'''

